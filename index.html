<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サポートBot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 700px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .chat-header p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .message.bot {
      align-items: flex-start;
    }

    .message.user {
      align-items: flex-end;
    }

    .message-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.bot .message-bubble {
      background: #fff;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-time {
      font-size: 0.7rem;
      color: #999;
      margin-top: 4px;
      padding: 0 8px;
    }

    .options-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .option-button {
      background: #fff;
      border: 2px solid #667eea;
      color: #667eea;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-button:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .category-button {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      color: white;
    }

    .category-button:hover {
      background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
    }

    .chat-input-area {
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #eee;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .chat-input:focus {
      border-color: #667eea;
    }

    .send-button {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .back-button {
      background: #6c757d;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 15px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .back-button:hover {
      background: #5a6268;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    .error-message {
      background: #fff3f3;
      border: 1px solid #ffcdd2;
      color: #c62828;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    /* スクロールバーのスタイル */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #999;
    }

    /* レスポンシブ対応 */
    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        max-width: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1 id="bot-name">サポートBot</h1>
      <p>お気軽にご質問ください</p>
    </div>

    <div class="chat-messages" id="chat-messages">
      <!-- メッセージがここに追加される -->
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <input 
          type="text" 
          class="chat-input" 
          id="chat-input" 
          placeholder="質問を入力してください..."
          autocomplete="off"
        >
        <button class="send-button" id="send-button" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // 設定 - ここにあなたのAPIエンドポイントを設定
    // ============================================
    const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyInaBBUvqIYu1zF0wi5ODq4gsXaRPHmnsnURqe5sFCWWfmwRW9d2vXxWNGXDOkVrp-7Q/exec';

    // ============================================
    // グローバル変数
    // ============================================
    let settings = {};
    let categories = [];
    let currentState = 'idle'; // idle, waiting, selecting

    // ============================================
    // 初期化
    // ============================================
    document.addEventListener('DOMContentLoaded', async () => {
      await initialize();
    });

    async function initialize() {
      try {
        // 設定を取得
        settings = await apiCall('getSettings');
        
        // ボット名を更新
        if (settings.bot_name) {
          document.getElementById('bot-name').textContent = settings.bot_name;
          document.title = settings.bot_name;
        }

        // カテゴリを取得
        categories = await apiCall('getCategories');

        // ウェルカムメッセージを表示
        const welcomeMsg = settings.welcome_message || 'こんにちは！ご質問をどうぞ。';
        addBotMessage(welcomeMsg);

        // カテゴリボタンを表示
        showCategoryButtons();

      } catch (error) {
        console.error('初期化エラー:', error);
        addErrorMessage('接続エラーが発生しました。ページを再読み込みしてください。');
      }
    }

    // ============================================
    // API通信
    // ============================================
    async function apiCall(action, params = {}) {
      const response = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain',
        },
        body: JSON.stringify({ action, ...params })
      });

      if (!response.ok) {
        throw new Error('API request failed');
      }

      return response.json();
    }

    // ============================================
    // メッセージ送信
    // ============================================
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const query = input.value.trim();

      if (!query || currentState === 'waiting') return;

      // ユーザーメッセージを表示
      addUserMessage(query);
      input.value = '';

      // ローディング表示
      currentState = 'waiting';
      showTypingIndicator();

      try {
        // キーワード検索
        const result = await apiCall('search', { query });

        hideTypingIndicator();
        currentState = 'idle';

        handleSearchResult(result);

      } catch (error) {
        console.error('検索エラー:', error);
        hideTypingIndicator();
        currentState = 'idle';
        addErrorMessage('エラーが発生しました。もう一度お試しください。');
        showCategoryButtons();
      }
    }

    // ============================================
    // 検索結果の処理
    // ============================================
    function handleSearchResult(result) {
      switch (result.type) {
        case 'single':
          // 1件のみヒット → 回答を表示
          addBotMessage(result.data.answer);
          showFollowUpOptions();
          break;

        case 'multiple':
          // 複数候補 → 選択肢を表示
          const multiMsg = settings.multiple_match_message || '以下の候補が見つかりました。選択してください。';
          addBotMessage(multiMsg);
          showFAQOptions(result.data);
          break;

        case 'no_match':
        case 'empty':
        default:
          // マッチなし → カテゴリ選択を促す
          const noMatchMsg = settings.no_match_message || '該当する回答が見つかりませんでした。カテゴリから選択してください。';
          addBotMessage(noMatchMsg);
          showCategoryButtons();
          break;
      }
    }

    // ============================================
    // カテゴリ選択
    // ============================================
    async function selectCategory(categoryName) {
      addUserMessage(categoryName);
      showTypingIndicator();
      currentState = 'waiting';

      try {
        const faqs = await apiCall('getFAQsByCategory', { category: categoryName });
        hideTypingIndicator();
        currentState = 'idle';

        if (faqs.length === 0) {
          addBotMessage('このカテゴリには質問がありません。');
          showCategoryButtons();
        } else if (faqs.length === 1) {
          addBotMessage(faqs[0].answer);
          showFollowUpOptions();
        } else {
          addBotMessage('以下からお選びください。');
          showFAQOptions(faqs);
        }
      } catch (error) {
        console.error('カテゴリ取得エラー:', error);
        hideTypingIndicator();
        currentState = 'idle';
        addErrorMessage('エラーが発生しました。');
        showCategoryButtons();
      }
    }

    // ============================================
    // FAQ選択
    // ============================================
    async function selectFAQ(faqId, question) {
      addUserMessage(question);
      showTypingIndicator();
      currentState = 'waiting';

      try {
        const faq = await apiCall('getFAQById', { id: faqId });
        hideTypingIndicator();
        currentState = 'idle';

        if (faq) {
          addBotMessage(faq.answer);
        } else {
          addBotMessage('回答が見つかりませんでした。');
        }
        showFollowUpOptions();
      } catch (error) {
        console.error('FAQ取得エラー:', error);
        hideTypingIndicator();
        currentState = 'idle';
        addErrorMessage('エラーが発生しました。');
        showCategoryButtons();
      }
    }

    // ============================================
    // UI更新関数
    // ============================================
    function addUserMessage(text) {
      const messagesContainer = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message user';
      messageDiv.innerHTML = `
        <div class="message-bubble">${escapeHtml(text)}</div>
        <div class="message-time">${getCurrentTime()}</div>
      `;
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    function addBotMessage(text) {
      const messagesContainer = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      messageDiv.innerHTML = `
        <div class="message-bubble">${escapeHtml(text)}</div>
        <div class="message-time">${getCurrentTime()}</div>
      `;
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    function addErrorMessage(text) {
      const messagesContainer = document.getElementById('chat-messages');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.textContent = text;
      messagesContainer.appendChild(errorDiv);
      scrollToBottom();
    }

    function showCategoryButtons() {
      const messagesContainer = document.getElementById('chat-messages');
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'message bot';

      let buttonsHtml = '<div class="options-container">';
      categories.forEach(cat => {
        buttonsHtml += `
          <button class="option-button category-button" onclick="selectCategory('${escapeHtml(cat.name)}')">
            ${escapeHtml(cat.description || cat.name)}
          </button>
        `;
      });
      buttonsHtml += '</div>';

      optionsDiv.innerHTML = buttonsHtml;
      messagesContainer.appendChild(optionsDiv);
      scrollToBottom();
    }

    function showFAQOptions(faqs) {
      const messagesContainer = document.getElementById('chat-messages');
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'message bot';

      let buttonsHtml = '<div class="options-container">';
      faqs.forEach(faq => {
        buttonsHtml += `
          <button class="option-button" onclick="selectFAQ(${faq.id}, '${escapeHtml(faq.question)}')">
            ${escapeHtml(faq.question)}
          </button>
        `;
      });
      buttonsHtml += '</div>';
      buttonsHtml += '<button class="back-button" onclick="showCategoryButtons()">← カテゴリに戻る</button>';

      optionsDiv.innerHTML = buttonsHtml;
      messagesContainer.appendChild(optionsDiv);
      scrollToBottom();
    }

    function showFollowUpOptions() {
      const messagesContainer = document.getElementById('chat-messages');
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'message bot';
      optionsDiv.innerHTML = `
        <div class="options-container">
          <button class="option-button category-button" onclick="showCategoryButtons()">
            他の質問をする
          </button>
        </div>
      `;
      messagesContainer.appendChild(optionsDiv);
      scrollToBottom();
    }

    function showTypingIndicator() {
      const messagesContainer = document.getElementById('chat-messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.id = 'typing-indicator';
      typingDiv.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      messagesContainer.appendChild(typingDiv);
      scrollToBottom();
    }

    function hideTypingIndicator() {
      const typingDiv = document.getElementById('typing-indicator');
      if (typingDiv) {
        typingDiv.remove();
      }
    }

    // ============================================
    // ユーティリティ関数
    // ============================================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      const messagesContainer = document.getElementById('chat-messages');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Enterキーで送信
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
